# Macro data-release calendar (deterministic event-calendar input).
#
# Each entry = one scheduled high-impact US macro print, with the REFERENCE month it
# covers and its public RELEASE date (all 8:30 a.m. ET). Used by the event overlay to
# know which forecast-month contains a CPI / Core-PCE / NFP print and whether it lands
# BEFORE or AFTER an FOMC decision (see configs/fomc_calendar.yaml).
#
# precision:
#   confirmed = taken from the official BLS/BEA schedule (verified).
#   estimated = derived from the fixed monthly release pattern below; REFRESH from the
#               official schedule pages when available (they block simple scrapers — use a
#               browser fetch or update by hand each month).
#
# Fixed release patterns (US):
#   nfp  (Employment Situation, BLS): ~first Friday of the month, covers PRIOR month.
#   cpi  (Consumer Price Index, BLS): ~second week (Tue-Thu), covers PRIOR month.
#   pce  (Personal Income & Outlays / Core PCE, BEA): ~last week, covers PRIOR month.
# FRED series already wired: CPIAUCSL (CPI), PCEPILFE (core PCE). NFP = PAYEMS (add if used).
#
# Sources: https://www.bls.gov/schedule/  |  https://www.bea.gov/news/schedule
# Maintained by Claude; current as of 2026-06-02.

releases:

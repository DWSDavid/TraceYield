# FRED series IDs grouped by the factor they feed.
# release_lag_days is an approximate calendar-day delay from reference date to
# public availability for point-in-time backtests.

treasury_yields:        # prediction targets + curve
  DGS3MO:
    description: "3-Month Treasury bill yield - front-end policy-path proxy"
    release_lag_days: 1
  DGS6MO:
    description: "6-Month Treasury bill yield - front-end forward proxy"
    release_lag_days: 1
  DGS1:
    description: "1-Year Treasury yield - short-rate path proxy"
    release_lag_days: 1
  DGS2:
    description: "2-Year Treasury yield"
    release_lag_days: 1
  DGS5:
    description: "5-Year Treasury yield"
    release_lag_days: 1
  DGS10:
    description: "10-Year Treasury yield - PRIMARY TARGET"
    release_lag_days: 1
  DGS20:
    description: "20-Year Treasury yield"
    release_lag_days: 1
  DGS30:
    description: "30-Year Treasury yield"
    release_lag_days: 1
  T10Y2Y:
    description: "10Y-2Y spread (2s10s curve)"
    release_lag_days: 1

inflation:
  CPIAUCSL:
    description: "CPI, all urban consumers"
    release_lag_days: 35
  CPILFESL:
    description: "Core CPI, all urban consumers less food and energy"
    release_lag_days: 35
  PCEPI:
    description: "Personal consumption expenditures price index"
    release_lag_days: 35
  PCEPILFE:
    description: "Core PCE price index (Fed preferred gauge)"
    release_lag_days: 35
  T5YIE:
    description: "5-Year breakeven inflation"
    release_lag_days: 1
  T10YIE:
    description: "10-Year breakeven inflation"
    release_lag_days: 1
  T5YIFR:
    description: "5y5y forward inflation expectation"
    release_lag_days: 1

growth:
  PAYEMS:
    description: "Total nonfarm payroll employment"
    release_lag_days: 7
  UNRATE:
    description: "Civilian unemployment rate"
    release_lag_days: 7
  ICSA:
    description: "Initial unemployment insurance claims"
    release_lag_days: 7
  IPMAN:
    description: "Industrial production: manufacturing, free FRED growth/manufacturing proxy"
    release_lag_days: 7
  RSAFS:
    description: "Advance retail sales"
    release_lag_days: 20
  JTSJOL:
    description: "JOLTS job openings, total nonfarm"
    release_lag_days: 45

liquidity:
  WALCL:
    description: "Fed total assets (balance sheet size) - weekly H.4.1"
    release_lag_days: 7
  WRESBAL:
    description: "Reserve balances held at Fed (bank reserves)"
    release_lag_days: 7
  RRPONTSYD:
    description: "Overnight reverse repo (RRP) volume"
    release_lag_days: 1
  WTREGEN:
    description: "Treasury General Account (TGA)"
    release_lag_days: 1

global_rates:
  IRLTLT01DEM156N:
    description: "Germany 10Y long-term govt bond yield"
    release_lag_days: 1
  IRLTLT01JPM156N:
    description: "Japan 10Y long-term govt bond yield"
    release_lag_days: 1
  # US-DE / US-JP differentials computed in signals/

policy:
  DFEDTARU:
    description: "Fed funds target upper bound"
    release_lag_days: 1
  EFFR:
    description: "Effective federal funds rate"
    release_lag_days: 1
  SOFR:
    description: "Secured overnight financing rate"
    release_lag_days: 1
  FEDTARMD:
    description: "FOMC SEP median fed funds rate projection"
    release_lag_days: 1
  FEDTARMDLR:
    description: "FOMC SEP longer-run median fed funds rate projection"
    release_lag_days: 1

cross_asset:            # impact map / market-implied context
  VIXCLS:
    description: "VIX equity volatility"
    release_lag_days: 1
  DTWEXBGS:
    description: "Broad trade-weighted USD index"
    release_lag_days: 1
